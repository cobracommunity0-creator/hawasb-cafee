<!-- CSS إضافي لتحسين الحقول وإظهار المسميات -->
<style>
    .form-group-floating {
        position: relative;
        flex: 1;
        min-width: 140px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .form-group-floating label {
        font-size: 12px;
        color: var(--accent-primary);
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .form-group-floating input, 
    .form-group-floating select {
        padding: 10px 12px;
        background: var(--bg-base);
        border: 1px solid var(--border-color);
        color: white;
        border-radius: var(--radius-sm);
        outline: none;
        font-size: 14px;
        transition: 0.2s;
    }

    .form-group-floating input:focus, 
    .form-group-floating select:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
    }

    .checkbox-floating {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-base);
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        cursor: pointer;
        user-select: none;
    }

    .checkbox-floating input {
        accent-color: var(--accent-primary);
        width: 16px;
        height: 16px;
        cursor: pointer;
    }
</style>

<!-- نموذج إدارة الأصناف والأسعار المحدث -->
<h3><i class="fa-solid fa-utensils"></i> إدارة الأصناف والأسعار</h3>

<form id="product-form" onsubmit="saveProduct(event)" style="background: var(--bg-surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin: 15px 0; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
    <input type="hidden" id="prod-id">

    <!-- اسم الصنف -->
    <div class="form-group-floating">
        <label for="prod-name"><i class="fa-solid fa-tag"></i> اسم الصنف</label>
        <input type="text" id="prod-name" placeholder="مثال: إسبريسو" required>
    </div>

    <!-- القسم -->
    <div class="form-group-floating">
        <label for="prod-category"><i class="fa-solid fa-layer-group"></i> القسم (Category)</label>
        <input type="text" id="prod-category" placeholder="مثال: مشروبات ساخنة" required>
    </div>

    <!-- سعر التكلفة -->
    <div class="form-group-floating" style="max-width: 130px;">
        <label for="prod-cost"><i class="fa-solid fa-coins"></i> سعر التكلفة</label>
        <input type="number" step="0.5" id="prod-cost" placeholder="0.0" required>
    </div>

    <!-- سعر البيع -->
    <div class="form-group-floating" style="max-width: 130px;">
        <label for="prod-price"><i class="fa-solid fa-money-bill-wave"></i> سعر البيع</label>
        <input type="number" step="0.5" id="prod-price" placeholder="0.0" required>
    </div>

    <!-- الكمية / المخزون -->
    <div class="form-group-floating" style="max-width: 120px;">
        <label for="prod-stock"><i class="fa-solid fa-cubes"></i> الكمية المتاحة</label>
        <input type="number" step="0.1" id="prod-stock" placeholder="0" value="0">
    </div>

    <!-- وحدة القياس -->
    <div class="form-group-floating" style="max-width: 130px;">
        <label for="prod-unit"><i class="fa-solid fa-scale-balanced"></i> وحدة القياس</label>
        <select id="prod-unit">
            <option value="قطعة">قطعة</option>
            <option value="جرام">جرام</option>
            <option value="كيلو">كيلو</option>
            <option value="مليلتر">مليلتر</option>
            <option value="لتر">لتر</option>
        </select>
    </div>

    <!-- نوع الصنف -->
    <div class="form-group-floating" style="max-width: 160px;">
        <label><i class="fa-solid fa-mug-hot"></i> تصنيف الصنف</label>
        <label class="checkbox-floating">
            <input type="checkbox" id="prod-is-drink">
            <span style="font-size: 13px; color: var(--text-main);">مشروب / خدمة</span>
        </label>
    </div>

    <!-- زر الحفظ -->
    <button type="submit" style="background: var(--accent-success); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-sm); cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; height: 42px;">
        <i class="fa-solid fa-floppy-disk"></i> حفظ الصنف
    </button>
</form>

<table>
    <thead>
        <tr>
            <th>الصنف</th>
            <th>القسم</th>
            <th>التكلفة</th>
            <th>البيع</th>
            <th>المخزون</th>
            <th>الوحدة</th>
            <th>النوع</th>
            <th>إجراءات</th>
        </tr>
    </thead>
    <tbody id="products-table-body"></tbody>
</table>
