<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حواسب كافيه - POS</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Cairo', sans-serif; }
    /* Hide scrollbars for clean UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔴 أدخل بيانات Supabase الخاصة بك هنا
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      // States
      const [user, setUser] = useState(null);
      const [loginInput, setLoginInput] = useState({ username: '', pin: '' });
      const [activeShift, setActiveShift] = useState(null);
      
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [cart, setCart] = useState([]);
      const [paidAmount, setPaidAmount] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [variantModalProduct, setVariantModalProduct] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      const paidInputRef = useRef(null);

      // Fetch Products & Shift on mount or user change
      useEffect(() => {
        if (user) {
          fetchProducts();
          checkActiveShift();
        }
      }, [user]);

      // Auto Focus Cash Input whenever cart updates
      useEffect(() => {
        if (cart.length > 0 && paidInputRef.current) {
          paidInputRef.current.focus();
        }
      }, [cart]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2500);
      };

      const fetchProducts = async () => {
        const { data, error } = await supabase
          .from('products')
          .select('*, product_variants(*)');
        if (!error && data) {
          setProducts(data);
          const cats = ['ALL', ...new Set(data.map(p => p.category).filter(Boolean))];
          setCategories(cats);
        }
      };

      const checkActiveShift = async () => {
        if (!user) return;
        const { data } = await supabase
          .from('shifts')
          .select('*')
          .eq('user_id', user.id)
          .eq('status', 'open')
          .single();
        if (data) setActiveShift(data);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', loginInput.username)
          .eq('pin', loginInput.pin)
          .single();

        if (error || !data) {
          showToast('❌ بيانات الدخول غير صحيحة');
          return;
        }

        setUser(data);
        if (data.role === 'cashier') {
          // Check or Start Shift
          let { data: shift } = await supabase
            .from('shifts')
            .select('*')
            .eq('user_id', data.id)
            .eq('status', 'open')
            .single();

          if (!shift) {
            const { data: newShift } = await supabase
              .from('shifts')
              .insert([{ user_id: data.id, status: 'open', shift_date: new Date().toISOString().split('T')[0] }])
              .select()
              .single();
            shift = newShift;
          }
          setActiveShift(shift);
        }
      };

      // Add to Cart Logic
      const handleProductClick = (product) => {
        if (product.product_variants && product.product_variants.length > 0) {
          setVariantModalProduct(product);
        } else {
          addToCart(product, null);
        }
      };

      const addToCart = (product, variant) => {
        const cartKey = variant ? `${product.id}-${variant.id}` : `${product.id}`;
        const itemTitle = variant ? `${product.name} (${variant.variant_name})` : product.name;
        const price = variant ? parseFloat(variant.selling_price) : parseFloat(product.selling_price);
        const cost = variant ? parseFloat(variant.cost_price) : parseFloat(product.cost_price || 0);

        setCart(prev => {
          const existing = prev.find(item => item.key === cartKey);
          if (existing) {
            return prev.map(item => item.key === cartKey ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, {
            key: cartKey,
            productId: product.id,
            variantId: variant ? variant.id : null,
            name: itemTitle,
            price: price,
            cost: cost,
            qty: 1
          }];
        });
        setVariantModalProduct(null);
      };

      const updateQty = (key, delta) => {
        setCart(prev => prev.map(item => {
          if (item.key === key) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const clearCart = () => {
        setCart([]);
        setPaidAmount('');
      };

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const paid = parseFloat(paidAmount) || 0;
      const change = paid > subtotal ? paid - subtotal : 0;

      // Checkout (Fast & Double-Submit Safe)
      const handleCheckout = async (isStaff = false) => {
        if (cart.length === 0 || isSubmitting) return;

        setIsSubmitting(true);
        try {
          const salesData = cart.map(item => ({
            shift_id: activeShift?.id || null,
            product_id: item.productId,
            quantity: item.qty,
            unit_price: isStaff ? item.cost : item.price,
            unit_cost: item.cost,
            is_staff_order: isStaff ? 1 : 0
          }));

          const { error } = await supabase.from('sales').insert(salesData);

          if (error) throw error;

          showToast(isStaff ? '✅ تم تسجيل طلب الموظف' : '✅ تم الدفع والبيع بنجاح');
          clearCart();
        } catch (err) {
          showToast('❌ حدث خطأ أثناء الحفظ');
        } finally {
          setIsSubmitting(false);
        }
      };

      // Filtered Products
      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'ALL' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (!user) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
              <h1 className="text-3xl font-black text-amber-500 mb-1">☕ حواسب كافيه</h1>
              <span className="text-xs font-bold text-rose-500 bg-rose-500/10 px-3 py-1 rounded-full inline-block mb-6">Powered By #عمرو_حواسب</span>
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="text"
                  placeholder="اسم المستخدم"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-white focus:border-amber-500 outline-none"
                  value={loginInput.username}
                  onChange={e => setLoginInput({ ...loginInput, username: e.target.value })}
                  required
                />
                <input
                  type="password"
                  placeholder="رمز PIN"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-white focus:border-amber-500 outline-none"
                  value={loginInput.pin}
                  onChange={e => setLoginInput({ ...loginInput, pin: e.target.value })}
                  required
                />
                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 py-3 rounded-xl transition duration-150">
                  <i className="fa-solid fa-right-to-bracket ml-2"></i> دخول للنظام
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-800 border border-amber-500/40 text-amber-400 font-bold px-6 py-3 rounded-xl shadow-2xl animate-bounce">
              {toastMsg}
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center shrink-0">
            <div className="flex items-center gap-3">
              <span className="text-amber-500 text-xl font-black">☕ حواسب كافيه</span>
            </div>
            <div className="flex items-center gap-4">
              <span className="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold">
                👤 {user.username} ({user.role})
              </span>
              <button onClick={() => setUser(null)} className="text-rose-400 hover:bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20 text-xs font-bold transition">
                <i className="fa-solid fa-power-off ml-1"></i> خروج
              </button>
            </div>
          </header>

          {/* POS Area */}
          <div className="flex flex-1 overflow-hidden">
            {/* Products Grid Section */}
            <div className="flex-1 p-6 flex flex-col gap-4 overflow-hidden">
              {/* Search & Categories */}
              <div className="flex gap-3 items-center">
                <div className="relative flex-1">
                  <i className="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input
                    type="text"
                    placeholder="بحث عن صنف..."
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl pr-11 pl-4 py-2.5 text-sm text-white focus:border-amber-500 outline-none"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                  />
                </div>
              </div>

              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${
                      selectedCategory === cat
                        ? 'bg-amber-500 text-slate-950'
                        : 'bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {cat === 'ALL' ? 'الكل' : cat}
                  </button>
                ))}
              </div>

              {/* Products Cards */}
              <div className="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 pr-1">
                {filteredProducts.map(p => (
                  <div
                    key={p.id}
                    onClick={() => handleProductClick(p)}
                    className="bg-slate-900 border border-slate-800 hover:border-amber-500/50 hover:bg-slate-800/80 p-4 rounded-xl flex flex-col justify-between cursor-pointer transition transform active:scale-95 text-center min-h-[110px]"
                  >
                    <span className="font-bold text-sm text-slate-100">{p.name}</span>
                    <span className="font-extrabold text-amber-500 text-base mt-2">{p.selling_price} ج.م</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Cart Section */}
            <div className="w-[380px] bg-slate-900 border-r border-slate-800 flex flex-col p-5 shrink-0">
              <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                <h2 className="font-bold text-lg text-slate-100"><i className="fa-solid fa-cart-shopping text-amber-500 ml-2"></i> الطلب الحالي</h2>
                <button onClick={clearCart} className="text-slate-400 hover:text-rose-400 text-xs font-bold">
                  <i className="fa-solid fa-trash ml-1"></i> تفريغ
                </button>
              </div>

              {/* Cart List */}
              <div className="flex-1 overflow-y-auto py-3 space-y-2">
                {cart.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-slate-600 text-sm">
                    <i className="fa-solid fa-basket-shopping text-4xl mb-2"></i>
                    السلة فارغة
                  </div>
                ) : (
                  cart.map(item => (
                    <div key={item.key} className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                      <div className="flex flex-col">
                        <span className="font-bold text-xs text-slate-200">{item.name}</span>
                        <span className="text-amber-500 font-extrabold text-xs">{item.price * item.qty} ج.م</span>
                      </div>
                      <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-2 py-1 rounded-lg">
                        <button onClick={() => updateQty(item.key, -1)} className="text-slate-400 hover:text-rose-400 text-xs font-bold w-5 h-5 flex items-center justify-center">-</button>
                        <span className="text-xs font-bold px-1">{item.qty}</span>
                        <button onClick={() => updateQty(item.key, 1)} className="text-slate-400 hover:text-emerald-400 text-xs font-bold w-5 h-5 flex items-center justify-center">+</button>
                      </div>
                    </div>
                  ))
                )}
              </div>

              {/* Summary & Quick Payment */}
              <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 mb-3">
                <div className="flex justify-between text-sm font-semibold text-slate-400">
                  <span>إجمالي المشتريات:</span>
                  <span className="text-white font-bold">{subtotal} ج.م</span>
                </div>

                <div className="space-y-1">
                  <label className="text-xs text-slate-400 font-bold block">المبلغ المدفوع كاش:</label>
                  <input
                    ref={paidInputRef}
                    type="number"
                    placeholder="0"
                    value={paidAmount}
                    onChange={e => setPaidAmount(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') handleCheckout(false); }}
                    className="w-full bg-slate-900 border border-slate-800 focus:border-amber-500 text-center font-extrabold text-amber-400 rounded-lg py-2 text-base outline-none"
                  />
                </div>

                {paid > 0 && (
                  <div className="text-xs text-center font-bold text-emerald-400">
                    الباقي: {change} ج.م
                  </div>
                )}
              </div>

              {/* Fast Actions */}
              <div className="space-y-2">
                <button
                  disabled={cart.length === 0 || isSubmitting}
                  onClick={() => handleCheckout(false)}
                  className={`w-full py-3 rounded-xl font-extrabold text-sm transition flex items-center justify-center gap-2 ${
                    isSubmitting || cart.length === 0
                      ? 'bg-emerald-950 text-slate-500 cursor-not-allowed'
                      : 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 shadow-lg shadow-emerald-500/20'
                  }`}
                >
                  {isSubmitting ? (
                    <span>جاري التجهيز...</span>
                  ) : (
                    <>
                      <i className="fa-solid fa-check"></i>
                      إتمام البيع (Enter)
                    </>
                  )}
                </button>

                <button
                  disabled={cart.length === 0 || isSubmitting}
                  onClick={() => handleCheckout(true)}
                  className="w-full py-2.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 font-bold text-xs rounded-xl transition"
                >
                  <i className="fa-solid fa-user-tag ml-1"></i> طلب موظف (بسعر التكلفة)
                </button>
              </div>
            </div>
          </div>

          {/* Modal Select Variants (الأحجام) */}
          {variantModalProduct && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
                <h3 className="text-lg font-black text-amber-500 mb-1">{variantModalProduct.name}</h3>
                <p className="text-xs text-slate-400 mb-5">اختر الحجم أو الفئة المطلوب:</p>

                <div className="space-y-2">
                  {variantModalProduct.product_variants.map(v => (
                    <button
                      key={v.id}
                      onClick={() => addToCart(variantModalProduct, v)}
                      className="w-full bg-slate-950 hover:bg-amber-500/10 border border-slate-800 hover:border-amber-500/50 p-3 rounded-xl flex justify-between items-center transition font-bold"
                    >
                      <span className="text-slate-200">{v.variant_name}</span>
                      <span className="text-amber-500">{v.selling_price} ج.م</span>
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => setVariantModalProduct(null)}
                  className="mt-4 text-xs font-bold text-slate-400 hover:text-rose-400"
                >
                  إلغاء
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
