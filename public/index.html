<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حواسب كافيه - POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #334155;
            --accent-primary: #f59e0b;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-wrapper { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { width: 360px; background: var(--bg-surface); padding: 30px; border-radius: var(--radius); text-align: center; border: 1px solid var(--border-color); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: var(--bg-base); border: 1px solid var(--border-color); color: white; border-radius: 8px; text-align: center; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent-primary); color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }

        /* Layout */
        header { background: var(--bg-surface); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .pos-container { display: flex; height: calc(100vh - 60px); }
        
        .products-section { flex: 2.5; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .cart-section { flex: 1.5; min-width: 380px; background: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }

        .search-box input { width: 100%; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-color); color: white; border-radius: var(--radius); outline: none; }
        
        .category-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 600; }
        .cat-btn.active { background: var(--accent-primary); color: black; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .product-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: 0.1s; }
        .product-card:hover { border-color: var(--accent-primary); transform: translateY(-2px); }
        .product-title { font-weight: bold; font-size: 15px; }
        .product-price { color: var(--accent-primary); font-weight: 800; margin-top: 5px; }

        /* Cart */
        .cart-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        .cart-item { background: var(--bg-card); padding: 10px 14px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; }
        .qty-controls { display: flex; gap: 8px; align-items: center; background: var(--bg-base); padding: 2px 8px; border-radius: 6px; }
        .qty-controls button { background: none; border: none; color: white; cursor: pointer; font-size: 16px; }

        .cart-summary { background: var(--bg-base); padding: 15px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 10px; }
        .summary-row { display: flex; justify-content: space-between; font-weight: bold; }
        .paid-input { width: 100%; padding: 12px; background: var(--bg-card); border: 2px solid var(--accent-primary); color: white; text-align: center; font-size: 20px; font-weight: bold; border-radius: 8px; outline: none; }
        
        .btn-checkout { width: 100%; padding: 14px; background: var(--accent-success); color: white; font-size: 18px; font-weight: bold; border: none; border-radius: var(--radius); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Modal Variants */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--bg-surface); padding: 20px; border-radius: var(--radius); width: 320px; text-align: center; }
        .variant-btn { width: 100%; padding: 12px; margin: 6px 0; background: var(--bg-card); border: 1px solid var(--border-color); color: white; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .variant-btn:hover { background: var(--accent-primary); color: black; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-wrapper">
        <div class="login-box">
            <h2>☕ تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسم المستخدم" value="cashier">
            <input type="password" id="pin" placeholder="PIN" value="1111">
            <button onclick="login()">دخول</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <header>
            <div style="font-weight: bold; color: var(--accent-primary); font-size: 18px;">☕ حواسب كافيه POS</div>
            <div id="user-info" style="font-size: 14px; color: var(--text-muted);"></div>
        </header>

        <div class="pos-container">
            <div class="products-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 بحث عن صنف..." oninput="renderProducts()">
                </div>
                <div class="category-bar" id="category-bar"></div>
                <div class="products-grid" id="products-grid"></div>
            </div>

            <div class="cart-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>🛒 الطلب الحالي</h3>
                    <button onclick="clearCart()" style="background:none; border:none; color: var(--accent-danger); cursor:pointer;">تفريغ</button>
                </div>

                <div class="cart-list" id="cart-list"></div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>الإجمالي:</span>
                        <span id="cart-total" style="color: var(--accent-primary); font-size: 20px;">0 ج.م</span>
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--text-muted);">المبلغ المدفوع كاش (اضغط Enter للإتمام):</label>
                        <input type="number" id="paid-amount" class="paid-input" placeholder="0" oninput="calculateChange()" onkeydown="handlePaidKey(event)">
                    </div>
                    <div class="summary-row" style="font-size: 14px;">
                        <span>الباقي:</span>
                        <span id="change-amount" style="color: var(--accent-success);">0 ج.م</span>
                    </div>
                </div>

                <button id="checkout-btn" class="btn-checkout" onclick="checkout()" style="margin-top: 10px;">
                    <i class="fa-solid fa-check"></i> إتمام البيع
                </button>
            </div>
        </div>
    </div>

    <div id="variant-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="variant-title" style="margin-bottom: 15px;">اختر الحجم</h3>
            <div id="variant-list"></div>
            <button onclick="closeVariantModal()" style="margin-top: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer;">إلغاء</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let activeShift = null;
        let products = [];
        let cart = [];
        let currentCategory = 'ALL';

        async function login() {
            const username = document.getElementById('username').value;
            const pin = document.getElementById('pin').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, pin })
            });

            if (res.ok) {
                const data = await res.json();
                currentUser = data.user;
                activeShift = data.activeShift;

                if (currentUser.role === 'cashier' && !activeShift) {
                    const shiftRes = await fetch('/api/start-shift', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user_id: currentUser.id })
                    });
                    const shiftData = await shiftRes.json();
                    activeShift = { id: shiftData.shift_id };
                }

                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('user-info').innerText = `المستخدم: ${currentUser.username} | شيفت #${activeShift ? activeShift.id : 'أدمن'}`;

                loadProducts();
            } else {
                alert('بيانات الدخول غير صحيحة');
            }
        }

        async function loadProducts() {
            const res = await fetch('/api/products');
            products = await res.json();
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const categories = ['ALL', ...new Set(products.map(p => p.category))];
            const bar = document.getElementById('category-bar');
            bar.innerHTML = categories.map(c => `
                <button class="cat-btn ${currentCategory === c ? 'active' : ''}" onclick="selectCategory('${c}')">
                    ${c === 'ALL' ? 'الكل' : c}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('products-grid');

            const filtered = products.filter(p => {
                const matchesCat = currentCategory === 'ALL' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="handleProductClick(${p.id})">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.selling_price} ج.م</div>
                </div>
            `).join('');
        }

        function handleProductClick(productId) {
            const product = products.find(p => p.id === productId);
            if (product.variants && product.variants.length > 0) {
                showVariantModal(product);
            } else {
                addToCart(product, null);
            }
        }

        function showVariantModal(product) {
            document.getElementById('variant-title').innerText = product.name;
            const list = document.getElementById('variant-list');
            list.innerHTML = product.variants.map(v => `
                <button class="variant-btn" onclick="addToCartByVariant(${product.id}, ${v.id})">
                    <span>${v.variant_name}</span>
                    <span>${v.selling_price} ج.م</span>
                </button>
            `).join('');
            document.getElementById('variant-modal').classList.remove('hidden');
        }

        function closeVariantModal() {
            document.getElementById('variant-modal').classList.add('hidden');
        }

        function addToCartByVariant(productId, variantId) {
            const product = products.find(p => p.id === productId);
            const variant = product.variants.find(v => v.id === variantId);
            closeVariantModal();
            addToCart(product, variant);
        }

        function addToCart(product, variant) {
            const cartKey = variant ? `${product.id}-${variant.variant_name}` : `${product.id}`;
            const existing = cart.find(item => item.key === cartKey);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    key: cartKey,
                    id: product.id,
                    name: variant ? `${product.name} (${variant.variant_name})` : product.name,
                    variant_name: variant ? variant.variant_name : null,
                    selling_price: variant ? parseFloat(variant.selling_price) : parseFloat(product.selling_price),
                    cost_price: variant ? parseFloat(variant.cost_price) : parseFloat(product.calculated_cost || product.cost_price),
                    quantity: 1
                });
            }

            renderCart();
            focusPaidInput();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <div style="font-weight:bold;">${item.name}</div>
                        <div style="font-size:12px; color:var(--accent-primary);">${item.selling_price * item.quantity} ج.م</div>
                    </div>
                    <div class="qty-controls">
                        <button onclick="updateQty(${index}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQty(${index}, 1)">+</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, i) => sum + (i.selling_price * i.quantity), 0);
            document.getElementById('cart-total').innerText = `${total} ج.م`;
            calculateChange();
        }

        function updateQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            renderCart();
            if (cart.length > 0) focusPaidInput();
        }

        function clearCart() {
            cart = [];
            document.getElementById('paid-amount').value = '';
            renderCart();
        }

        function focusPaidInput() {
            const input = document.getElementById('paid-amount');
            input.focus();
            input.select();
        }

        function calculateChange() {
            const total = cart.reduce((sum, i) => sum + (i.selling_price * i.quantity), 0);
            const paid = parseFloat(document.getElementById('paid-amount').value) || 0;
            const change = paid > total ? paid - total : 0;
            document.getElementById('change-amount').innerText = `${change} ج.م`;
        }

        function handlePaidKey(e) {
            if (e.key === 'Enter') {
                checkout();
            }
        }

        async function checkout() {
            if (cart.length === 0) return;

            const btn = document.getElementById('checkout-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري إتمام العملية...`;

            const total = cart.reduce((sum, i) => sum + (i.selling_price * i.quantity), 0);
            const paid = parseFloat(document.getElementById('paid-amount').value) || total;

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        shift_id: activeShift.id,
                        items: cart,
                        is_staff_order: false,
                        paid_amount: paid
                    })
                });

                if (res.ok) {
                    clearCart();
                } else {
                    alert('حدث خطأ أثناء تنفيذ الطلب');
                }
            } catch (err) {
                alert('خطأ بالاتصال بالشبكة');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> إتمام البيع`;
            }
        }
    </script>
</body>
</html>
